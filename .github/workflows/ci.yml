name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            dsh-web-providers/package-lock.json
            dsh-notes/package-lock.json
      - name: Check Web Providers
        working-directory: dsh-web-providers
        run: |
          npm ci --ignore-scripts
          npm run check
          npm pack --dry-run
      - name: Check Notes
        working-directory: dsh-notes
        run: |
          npm ci --ignore-scripts
          npm run check
          npm pack --dry-run
